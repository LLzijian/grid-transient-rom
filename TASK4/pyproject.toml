[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task4-power-rom"
version = "0.1.0"
description = "Independent TASK4 research workspace: predictive memory and power-structured ROM"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "h5py>=3.8", "torch>=2.1", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
